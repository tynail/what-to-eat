name: Verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet restore tests --configfile NuGet.Config
      - run: dotnet test tests --no-restore
      - run: pwsh -File scripts/check-boundaries.ps1
      - run: for script in deploy/pi/*.sh tests/deployment-guards.sh; do bash -n "$script"; done && bash tests/deployment-guards.sh
      - run: npm ci --prefix client
      - run: npm test --prefix client
      - run: npm run format:check
      - run: npm run build --prefix client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Run browser tests against disposable ASP.NET fixture
        run: pwsh -File scripts/test-e2e.ps1 -SkipBuild
      - name: Report browser failure details
        if: failure()
        run: |
          while IFS= read -r file; do
            message=$(tr '\n' ' ' < "$file" | cut -c1-3000)
            printf '::error file=%s,title=Playwright failure::%s\n' "$file" "$message"
          done < <(find client/test-results -name error-context.md -type f -print)
      - run: docker compose config --quiet
        env:
          DOMAIN: meals.example.com
      - run: docker build -t weekly-table:test .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failures
          path: client/test-results/
