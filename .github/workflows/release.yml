name: Release to Raspberry Pi
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Main-branch commit or tag to release
        required: true
        default: main
      deploy:
        description: Deploy after building
        type: boolean
        default: false
permissions: {}
jobs:
  verify:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - id: revision
        env:
          RELEASE_REF: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          sha=$(git rev-parse --verify --end-of-options "${RELEASE_REF}^{commit}")
          git merge-base --is-ancestor "$sha" origin/main
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          git checkout --detach "$sha"
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: dotnet restore tests --configfile NuGet.Config
      - run: dotnet test tests --no-restore
      - run: pwsh -File scripts/check-boundaries.ps1
      - run: for script in deploy/pi/*.sh tests/deployment-guards.sh; do bash -n "$script"; done && bash tests/deployment-guards.sh
      - run: npm ci --prefix client
      - run: npm test --prefix client
      - run: npm run format:check
      - run: npm run build --prefix client
      - run: npx playwright install --with-deps chromium
        working-directory: client
      - name: Start browser fixture
        working-directory: client
        run: |
          npm exec vite preview -- --host 127.0.0.1 --port 5080 > "$RUNNER_TEMP/client-fixture.log" 2>&1 &
          for i in $(seq 1 30); do curl --fail http://127.0.0.1:5080/ && exit 0; sleep 1; done
          cat "$RUNNER_TEMP/client-fixture.log"
          exit 1
      - run: npm run test:e2e --prefix client
  image:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.verify.outputs.revision }}
          persist-credentials: false
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        id: build
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ghcr.io/tynail/what-to-eat:${{ needs.verify.outputs.revision }}
          labels: org.opencontainers.image.revision=${{ needs.verify.outputs.revision }}
      - id: image
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          REVISION: ${{ needs.verify.outputs.revision }}
        run: |
          image="ghcr.io/tynail/what-to-eat@$DIGEST"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          echo "Image: \`$image\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Manual deploy: \`sudo /opt/weekly-table/deploy.sh $image $REVISION\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Prepare deployment bundle
        run: |
          mkdir -p bundle
          cp deploy/pi/* bundle/
          cp scripts/backup.py bundle/backup.py
          cp deploy/PI_SETUP.md bundle/PI_SETUP.md
          tar czf weekly-table-deployment.tar.gz -C bundle .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: weekly-table-deployment-${{ needs.verify.outputs.revision }}
          path: weekly-table-deployment.tar.gz
          retention-days: 14
  deploy:
    if: inputs.deploy
    needs: [verify, image]
    runs-on: ubuntu-latest
    environment:
      name: production
    permissions:
      id-token: write
    steps:
      - name: Join private Tailscale network
        uses: tailscale/github-action@064b10558093f38325e838ddea35486bdc6b1d5c # v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:weekly-table-ci
          ping: ${{ vars.PI_TAILSCALE_HOST }}
      - name: Deploy verified image
        env:
          PI_HOST: ${{ vars.PI_TAILSCALE_HOST }}
          SSH_KEY: ${{ secrets.PI_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.PI_SSH_KNOWN_HOSTS }}
          IMAGE: ${{ needs.image.outputs.image }}
          REVISION: ${{ needs.verify.outputs.revision }}
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/deploy_key ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes "weekly-table-deploy@$PI_HOST" "deploy $IMAGE $REVISION"
